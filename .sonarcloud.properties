# SonarCloud configuration for risk-sentinel_NIST-800-53-Profile.
#
# THE FILENAME IS LOAD-BEARING. Analysis runs via the SonarCloud GitHub App
# (automatic analysis), which reads `.sonarcloud.properties`. It does NOT read
# `sonar-project.properties` -- that file is for scanner-CLI runs, which this
# estate does not do, so exclusions placed there are silently ignored.
#
# This was not theoretical: the first analysis of this repository ran with the
# exclusions in sonar-project.properties and still reported 1,020 files and
# 35,262 ncloc -- the whole generated catalog -- because the file was never
# read. Renaming it is the fix.
#
# .github/workflows/sonarqube-hdf-emit.yml only fetches the results afterwards
# and converts them to OHDF. This file exists for one reason: to keep the
# analysis pointed at the code someone wrote.
#
# Unlike the other repositories here, almost nothing in this one is hand-written.
# controls/ is 1,014 Ruby files emitted by tools/nist_catalog_to_inspec/
# generate.py from NIST's published OSCAL, and inspec.yml, inputs.yml and
# inputs.template.yml are generated beside them. Analysed, they would swamp
# every metric with a single template repeated a thousand times: the duplication
# figure would describe the generator's emit function rather than this codebase,
# and any finding raised against a control file cannot be fixed there anyway --
# the next regeneration overwrites it. See the README on hand-edits.
#
# What is left after the exclusions is the actual source: the generator, the
# ODP seeder and their tests.

sonar.projectKey=risk-sentinel_NIST-800-53-Profile
sonar.organization=risk-sentinel

# Two groups, one key -- sonar.exclusions is last-one-wins, so both belong here:
#
#   controls/**, inspec.yml, inputs*.yml
#       Generated. Regenerate with tools/nist_catalog_to_inspec/generate.py;
#       never hand-edit, and never "fix" a Sonar finding inside them.
#
#   tests/trufflehog-fixture/**
#       The synthetic AWS key that proves the TruffleHog gate still fires
#       (.github/workflows/secret-scan.yml). Deliberate, fake and load-bearing;
#       excluded so Sonar does not raise it as a hardcoded credential.
#
#   tests/checkov-junit-fixture/**
#       Same category. Synthetic Terraform that exists to be non-compliant --
#       an open security group and unencrypted buckets -- so checkov produces
#       failures to convert. Sonar is right about every finding it raises there
#       and rated the PR Security C; the findings simply describe test data, and
#       "fixing" them would delete the fixture's reason to exist. Nothing here
#       is deployed or referenced by any module. Excluded with owner approval.
sonar.exclusions=controls/**,inspec.yml,inputs.yml,inputs.template.yml,tests/trufflehog-fixture/**,tests/checkov-junit-fixture/**

sonar.python.version=3.10,3.11,3.12
