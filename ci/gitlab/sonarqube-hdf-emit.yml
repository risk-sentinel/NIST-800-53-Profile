# GitLab template — fetch this project's SonarQube findings and produce
# audit-ready HDF evidence.
#
# Include it (nothing else needs to be copied into your repository):
#
#   include:
#     - project: <your-org>/NIST-800-53-Profile
#       ref: main
#       file: /ci/gitlab/sonarqube-hdf-emit.yml
#       inputs:
#         sonar_project_key: my-group_my-project
#
# Or clone this repo in your own job and paste the script below; both work.
#
# This publishes the HDF as a job artifact and does not push to S3. See
# docs/ci-templates.md for why, and for how to add the emit step.
#
# ---- Adopting this in your own organization ---------------------------------
#
# You need SONAR_TOKEN as a masked CI/CD variable and a SonarQube/SonarCloud
# project. Nothing else.

spec:
  inputs:
    sonar_project_key:
      description: >-
        SonarQube/SonarCloud project key. Defaults to the GitLab project path
        with slashes replaced, which is what SonarCloud assigns at onboarding —
        but a project RENAMED after onboarding keeps its old key, so check.
      default: ""
    sonar_host_url:
      description: >-
        Overrides the SONAR_HOST_URL CI/CD variable. Empty means "use the
        variable, or sonarcloud.io" -- the default must stay empty or an
        include input would always beat a variable the adopter set.
      default: ""
    sonar_organization:
      description: >-
        Overrides the SONAR_ORGANIZATION CI/CD variable. Empty for self-hosted
        SonarQube, or to let the variable supply it.
      default: ""
    image:
      description: Image carrying the hdf CLI. Bakes hdf 3.4.1.
      default: risksentinel/sparc-auditor:v0.5.0
    job_name:
      default: sonarqube-hdf-emit
---

"$[[ inputs.job_name ]]":
  image: "$[[ inputs.image ]]"
  variables:
    # Suffixed _INPUT and resolved in the script, NOT assigned to the names the
    # job actually uses. A job-level `variables:` entry OVERRIDES a global one,
    # so writing SONAR_HOST_URL here would silently clobber whatever the adopter
    # set in .gitlab-variables.yml -- which is how the first cut of this file
    # shipped a variables pattern where nothing the adopter set did anything.
    #
    # Precedence, high to low: include input -> CI/CD variable -> built-in.
    SONAR_HOST_URL_INPUT: "$[[ inputs.sonar_host_url ]]"
    SONAR_ORGANIZATION_INPUT: "$[[ inputs.sonar_organization ]]"
    SONAR_PROJECT_KEY_INPUT: "$[[ inputs.sonar_project_key ]]"
  script:
    # 1 — resolve and VERIFY the project key before fetching anything.
    #
    # A wrong key is not an error: the API returns nothing for an unknown
    # project, and that converts into a valid, EMPTY, clean-looking report.
    # Verifying first is the difference between "no findings" and "we asked the
    # wrong question".
    - |
      set -euo pipefail
      if [ -z "${SONAR_TOKEN:-}" ]; then
        echo "ERROR: SONAR_TOKEN is not set. Without it there is nothing to fetch, and an empty result converts into a clean-looking report."
        exit 1
      fi
      # include input -> CI/CD variable -> derived/built-in.
      SONAR_HOST_URL="${SONAR_HOST_URL_INPUT:-${SONAR_HOST_URL:-https://sonarcloud.io}}"
      SONAR_ORGANIZATION="${SONAR_ORGANIZATION_INPUT:-${SONAR_ORGANIZATION:-}}"
      KEY="${SONAR_PROJECT_KEY_INPUT:-${SONAR_PROJECT_KEY:-}}"
      if [ -z "$KEY" ]; then
        KEY="$(printf '%s' "$CI_PROJECT_PATH" | tr '/' '_')"
      fi
      # Carry the resolved values to the later script blocks; each `- |` block
      # is its own shell, so a plain assignment would not survive.
      printf '%s\n' "$SONAR_HOST_URL" > .sonar-host
      printf '%s\n' "$SONAR_ORGANIZATION" > .sonar-org
      code=$(curl -sS -o /tmp/sonar-project.json -w '%{http_code}' \
        --proto '=https' --proto-redir '=https' --tlsv1.2 \
        -u "${SONAR_TOKEN}:" \
        "${SONAR_HOST_URL}/api/components/show?component=${KEY}")
      if [ "$code" = "404" ]; then
        echo "ERROR: no SonarQube project with key '${KEY}'."
        echo "ERROR: SonarCloud does not rename a project key when the repository is renamed, so a project renamed after onboarding keeps its OLD key. Pass sonar_project_key explicitly, or rename the key to match."
        exit 1
      fi
      if [ "$code" != "200" ]; then
        echo "ERROR: could not verify the SonarQube project (HTTP ${code}). Refusing to fetch: an unverified key can return an empty result that looks clean."
        cat /tmp/sonar-project.json || true
        exit 1
      fi
      echo "$KEY" > .sonar-key
      echo "Verified SonarQube project: ${KEY}"

    # 2 — fetch and convert. The image already carries the hdf CLI, so there is
    #     no download to verify here.
    - |
      set -euo pipefail
      KEY="$(cat .sonar-key)"
      SONAR_HOST_URL="$(cat .sonar-host)"
      SONAR_ORGANIZATION="$(cat .sonar-org)"
      OUT="${CI_PROJECT_NAME}-sonarqube-hdf.json"
      export SONARQUBE_TOKEN="$SONAR_TOKEN"
      args="fetch sonarqube $OUT --url $SONAR_HOST_URL --project-key $KEY --format hdf"
      if [ -n "${SONAR_ORGANIZATION:-}" ]; then
        args="$args --organization $SONAR_ORGANIZATION"
      fi
      # shellcheck disable=SC2086
      hdf $args
      echo "HDF_FILE=$OUT" > .hdf-env

    # 3 — stamp scan provenance. LOCKED label vocabulary: keep these key names
    #     identical across forges and scanners, or cross-repo aggregation stops
    #     grouping on the same keys.
    - |
      set -euo pipefail
      . ./.hdf-env
      KEY="$(cat .sonar-key)"
      hdf label set "$HDF_FILE" \
        repo="$CI_PROJECT_PATH" \
        commit="$CI_COMMIT_SHA" \
        ref="$CI_COMMIT_REF_NAME" \
        scanner=sonarqube \
        run_id="$CI_PIPELINE_ID" \
        sonar_project_key="$KEY" \
        -o "$HDF_FILE.labeled"
      mv "$HDF_FILE.labeled" "$HDF_FILE"
      hdf label show "$HDF_FILE"

    # 4 — validate. A clean project (zero open issues) is valid evidence and
    #     schema validation correctly accepts it; that is the point, because a
    #     clean repo and a broken pipeline must not leave identical traces.
    - |
      set -euo pipefail
      . ./.hdf-env
      test -s "$HDF_FILE"
      hdf validate "$HDF_FILE" -q
      echo "OHDF schema-valid: $HDF_FILE"

    - |
      set -euo pipefail
      . ./.hdf-env
      echo "===== HDF rollup ====="
      hdf list "$HDF_FILE" || true
  # Gated on SONAR_TOKEN existing. Without it this job does not run at all,
  # rather than running and failing, so a fresh clone has a green pipeline
  # before anything is configured.
  #
  # A skipped job is invisible, and a green pipeline that assessed nothing is
  # the failure this estate keeps finding elsewhere -- so the `pipeline-coverage`
  # job in the root .gitlab-ci.yml always runs and states what was skipped.
  #
  # The in-script SONAR_TOKEN check stays too: this rule fires on the variable
  # being DEFINED, and a defined-but-empty one would otherwise reach the fetch
  # and convert into a clean-looking empty report.
  rules:
    - if: '$SONAR_TOKEN'
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - "*-sonarqube-hdf.json"
