<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-label="The import chain from catalog to SAR, and a SAR observation and finding whose actors, subjects, evidence and target resolve back to metadata parties, SSP components, back-matter resources and SSP statements. HDF results convert into the SAR.">
      <style>text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;fill:#16202a}
.t{font-size:13px;font-weight:600}
.f{font-size:11px;font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#56636f}
.fx{font-size:11px;font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#16202a}
.sm{font-size:10.5px;fill:#56636f}
.hdr-m{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:600;fill:#2d5896}
.hdr-i{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:600;fill:#0d7069}
.hdr-b{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:600;fill:#9a5a08}
.hdr{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:600;fill:#16202a}
.box-m{fill:#e4ecf7;stroke:#2d5896;stroke-width:1.5}
.box-i{fill:#e2f1ef;stroke:#0d7069;stroke-width:1.5}
.box-b{fill:#f6ebdc;stroke:#9a5a08;stroke-width:1.5}
.box-n{fill:#f3f6f7;stroke:#56636f;stroke-width:1.2}
.card-m{fill:#ffffff;stroke:#2d5896;stroke-width:1}
.card-i{fill:#ffffff;stroke:#0d7069;stroke-width:1}
.card-b{fill:#ffffff;stroke:#9a5a08;stroke-width:1}
.q{fill:#ffffff;stroke:#16202a;stroke-width:1.2}
.ext{fill:#f3f6f7;stroke:#56636f;stroke-width:1.2;stroke-dasharray:4 3}
.edge{fill:none;stroke:#16202a;stroke-width:1.4}
.edge-d{fill:none;stroke:#16202a;stroke-width:1.4;stroke-dasharray:5 4}
.edge-b{fill:none;stroke:#9a5a08;stroke-width:1.5}
.ah{fill:#16202a}
.ah-b{fill:#9a5a08}
.rule{stroke:#c7d1d9;stroke-width:1}
.hl-m{fill:#2d5896}
.hl-i{fill:#0d7069}
.hl-b{fill:#9a5a08}
text{font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif}</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="m4" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="ah"/></marker></defs>
      <!-- import chain -->
      <rect x="20" y="24" width="160" height="58" rx="4" class="box-n"/>
      <text x="34" y="47" class="t">Catalog</text><text x="34" y="67" class="f">controls · parts</text>
      <rect x="210" y="24" width="160" height="58" rx="4" class="box-n"/>
      <text x="224" y="47" class="t">Profile</text><text x="224" y="67" class="f">imports[].href</text>
      <rect x="400" y="24" width="160" height="58" rx="4" class="box-i"/>
      <text x="414" y="47" class="t">SSP</text><text x="414" y="67" class="f">import-profile.href</text>
      <rect x="590" y="24" width="160" height="58" rx="4" class="box-n"/>
      <text x="604" y="47" class="t">SAP</text><text x="604" y="67" class="f">import-ssp.href</text>
      <rect x="780" y="24" width="160" height="58" rx="4" class="box-n"/>
      <text x="794" y="47" class="t">SAR</text><text x="794" y="67" class="f">import-ap.href</text>
      <line x1="210" y1="53" x2="184" y2="53" class="edge" marker-end="url(#m4)"/>
      <line x1="400" y1="53" x2="374" y2="53" class="edge" marker-end="url(#m4)"/>
      <line x1="590" y1="53" x2="564" y2="53" class="edge" marker-end="url(#m4)"/>
      <line x1="780" y1="53" x2="754" y2="53" class="edge" marker-end="url(#m4)"/>

      <!-- left: resolution targets -->
      <rect x="20" y="118" width="380" height="372" rx="6" class="box-n" style="fill:none;stroke-dasharray:6 4"/>
      <text x="36" y="140" class="sm">what the SAR points back to</text>
      <rect x="40" y="156" width="340" height="50" rx="4" class="card-m"/>
      <text x="54" y="176" class="t">metadata.parties[]</text>
      <text x="54" y="195" class="f">assessor, when actor type is party</text>
      <rect x="40" y="216" width="340" height="50" rx="4" class="card-i"/>
      <text x="54" y="236" class="t">SSP system-implementation.components[]</text>
      <text x="54" y="255" class="f">uuid 9a4e…41c0 · API Service</text>
      <rect x="40" y="276" width="340" height="50" rx="4" class="card-b"/>
      <text x="54" y="296" class="t">SAR back-matter.resources[]</text>
      <text x="54" y="315" class="f">#c93d… → results.hdf.json · SHA-256</text>
      <rect x="40" y="394" width="340" height="68" rx="4" class="card-i"/>
      <text x="54" y="414" class="t">SSP statement ac-2_smt.a</text>
      <text x="54" y="433" class="f">uuid 8d2a…c311</text>
      <text x="54" y="451" class="f">by-component prose · status · evidence links</text>

      <!-- right: SAR -->
      <rect x="560" y="118" width="380" height="372" rx="6" class="box-n"/>
      <text x="576" y="140" class="hdr">SAR results[]</text>
      <rect x="576" y="152" width="348" height="162" rx="4" class="q"/>
      <text x="590" y="172" class="fx" style="font-weight:600">observations[]</text>
      <text x="590" y="196" class="fx">origins.actors <tspan class="f">type: tool · actor-uuid</tspan></text>
      <text x="590" y="228" class="fx">subjects <tspan class="f">type: component · subject-uuid</tspan></text>
      <text x="590" y="260" class="fx">relevant-evidence <tspan class="f">href "#c93d…"</tspan></text>
      <text x="590" y="292" class="fx">methods <tspan class="f">[TEST] · collected · expires</tspan></text>
      <rect x="576" y="330" width="348" height="146" rx="4" class="q"/>
      <text x="590" y="350" class="fx" style="font-weight:600">findings[]</text>
      <text x="590" y="376" class="fx">target <tspan class="f">type: statement-id · ac-2_smt.a</tspan></text>
      <text x="590" y="396" class="f">status: { state: satisfied }</text>
      <text x="590" y="424" class="fx">implementation-statement-uuid</text>
      <text x="590" y="440" class="f">8d2a…c311</text>
      <text x="590" y="464" class="fx">related-observations <tspan class="f">→ observation uuid</tspan></text>

      <!-- resolution edges -->
      <line x1="730" y1="152" x2="730" y2="86" class="edge" marker-end="url(#m4)"/>
      <text x="736" y="112" class="sm">tool → SAP assessment-assets</text>
      <path d="M576,196 C480,196 480,181 384,181" class="edge-d" marker-end="url(#m4)"/>
      <text x="480" y="178" class="sm" text-anchor="middle">or type: party</text>
      <path d="M576,224 C480,224 480,241 384,241" class="edge" marker-end="url(#m4)"/>
      <path d="M576,256 C480,256 480,301 384,301" class="edge" marker-end="url(#m4)"/>
      <path d="M576,372 C480,372 480,420 384,420" class="edge" marker-end="url(#m4)"/>
      <path d="M576,430 C480,430 480,432 384,432" class="edge" marker-end="url(#m4)"/>

      <!-- HDF -->
      <rect x="20" y="512" width="920" height="86" rx="6" class="box-i"/>
      <text x="36" y="535" class="t">HDF Results into the SAR</text>
      <text x="36" y="556" class="fx">hdf convert --from hdf --to oscal-sar results.json -o sar.json</text>
      <text x="36" y="575" class="f">baselines[] → results[] · requirements[] → findings[] · passed → satisfied, failed → not-satisfied</text>
      <text x="36" y="591" class="f">Convention: reuse the HDF componentId as the OSCAL component uuid so subjects resolve with no lookup table</text>
      <line x1="750" y1="512" x2="750" y2="494" class="edge" marker-end="url(#m4)"/>
    </svg>