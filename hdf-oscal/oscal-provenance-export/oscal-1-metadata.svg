<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="The OSCAL metadata block with six field groups, each answering one provenance question: when it was produced, which release and schema, what changed, whether it is the same document, who is accountable, and who approved it.">
      <style>text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;fill:#16202a}
.t{font-size:13px;font-weight:600}
.f{font-size:11px;font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#56636f}
.fx{font-size:11px;font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#16202a}
.sm{font-size:10.5px;fill:#56636f}
.hdr-m{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:600;fill:#2d5896}
.hdr-i{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:600;fill:#0d7069}
.hdr-b{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:600;fill:#9a5a08}
.hdr{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:600;fill:#16202a}
.box-m{fill:#e4ecf7;stroke:#2d5896;stroke-width:1.5}
.box-i{fill:#e2f1ef;stroke:#0d7069;stroke-width:1.5}
.box-b{fill:#f6ebdc;stroke:#9a5a08;stroke-width:1.5}
.box-n{fill:#f3f6f7;stroke:#56636f;stroke-width:1.2}
.card-m{fill:#ffffff;stroke:#2d5896;stroke-width:1}
.card-i{fill:#ffffff;stroke:#0d7069;stroke-width:1}
.card-b{fill:#ffffff;stroke:#9a5a08;stroke-width:1}
.q{fill:#ffffff;stroke:#16202a;stroke-width:1.2}
.ext{fill:#f3f6f7;stroke:#56636f;stroke-width:1.2;stroke-dasharray:4 3}
.edge{fill:none;stroke:#16202a;stroke-width:1.4}
.edge-d{fill:none;stroke:#16202a;stroke-width:1.4;stroke-dasharray:5 4}
.edge-b{fill:none;stroke:#9a5a08;stroke-width:1.5}
.ah{fill:#16202a}
.ah-b{fill:#9a5a08}
.rule{stroke:#c7d1d9;stroke-width:1}
.hl-m{fill:#2d5896}
.hl-i{fill:#0d7069}
.hl-b{fill:#9a5a08}
text{font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif}</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="m1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="ah"/></marker></defs>
      <rect x="40" y="30" width="400" height="470" rx="6" class="box-m"/>
      <text x="56" y="56" class="hdr-m">metadata</text>
      <text x="424" y="56" class="sm" text-anchor="end">required on every OSCAL document</text>

      <rect x="56" y="80" width="368" height="56" rx="4" class="card-m"/>
      <text x="70" y="102" class="fx">last-modified* · published</text>
      <text x="70" y="123" class="f">2026-09-28T14:02:00-05:00</text>
      <rect x="56" y="146" width="368" height="56" rx="4" class="card-m"/>
      <text x="70" y="168" class="fx">version* · oscal-version*</text>
      <text x="70" y="189" class="f">"3.2.0" · "1.2.3"</text>
      <rect x="56" y="212" width="368" height="56" rx="4" class="card-m"/>
      <text x="70" y="234" class="fx">revisions[]</text>
      <text x="70" y="255" class="f">version · last-modified · remarks per change</text>
      <rect x="56" y="278" width="368" height="56" rx="4" class="card-m"/>
      <text x="70" y="300" class="fx">document-ids[]</text>
      <text x="70" y="321" class="f">{ scheme, identifier } stable across versions</text>
      <rect x="56" y="344" width="368" height="78" rx="4" class="card-m"/>
      <text x="70" y="366" class="fx">roles[] → responsible-parties[] → parties[]</text>
      <text x="70" y="388" class="f">role-id: "system-owner" → party-uuids[]</text>
      <text x="70" y="410" class="f">party: uuid · type · name · external-ids</text>
      <rect x="56" y="432" width="368" height="56" rx="4" class="card-m"/>
      <text x="70" y="454" class="fx">actions[]</text>
      <text x="70" y="475" class="f">uuid · date · type · system · responsible-parties</text>

      <line x1="424" y1="108" x2="596" y2="108" class="edge" marker-end="url(#m1)"/>
      <line x1="424" y1="174" x2="596" y2="174" class="edge" marker-end="url(#m1)"/>
      <line x1="424" y1="240" x2="596" y2="240" class="edge" marker-end="url(#m1)"/>
      <line x1="424" y1="306" x2="596" y2="306" class="edge" marker-end="url(#m1)"/>
      <line x1="424" y1="383" x2="596" y2="383" class="edge" marker-end="url(#m1)"/>
      <line x1="424" y1="460" x2="596" y2="460" class="edge" marker-end="url(#m1)"/>

      <rect x="600" y="83" width="320" height="50" rx="4" class="q"/>
      <text x="614" y="102" class="t">When was it produced?</text>
      <text x="614" y="121" class="f">timezone-aware timestamps</text>
      <rect x="600" y="149" width="320" height="50" rx="4" class="q"/>
      <text x="614" y="168" class="t">Which release, on which schema?</text>
      <text x="614" y="187" class="f">document version · OSCAL model version</text>
      <rect x="600" y="215" width="320" height="50" rx="4" class="q"/>
      <text x="614" y="234" class="t">What changed, and when?</text>
      <text x="614" y="253" class="f">history travels inside the file</text>
      <rect x="600" y="281" width="320" height="50" rx="4" class="q"/>
      <text x="614" y="300" class="t">Is this the same document?</text>
      <text x="614" y="319" class="f">identity that survives re-versioning</text>
      <rect x="600" y="358" width="320" height="50" rx="4" class="q"/>
      <text x="614" y="377" class="t">Who is accountable?</text>
      <text x="614" y="396" class="f">roles resolved to named parties</text>
      <rect x="600" y="435" width="320" height="50" rx="4" class="q"/>
      <text x="614" y="454" class="t">Who approved it, and when?</text>
      <text x="614" y="473" class="f">approval recorded as data, with a date</text>
      <text x="920" y="512" class="sm" text-anchor="end">* required. Every responsible-roles[].role-id elsewhere in the document resolves here.</text>
    </svg>