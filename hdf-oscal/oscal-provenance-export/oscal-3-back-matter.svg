<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-label="Four kinds of references point by fragment identifier into one back-matter resource. The resource's rlinks locate a results file and a procedure document, and its SHA-256 hashes let a tool verify both.">
      <style>text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;fill:#16202a}
.t{font-size:13px;font-weight:600}
.f{font-size:11px;font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#56636f}
.fx{font-size:11px;font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#16202a}
.sm{font-size:10.5px;fill:#56636f}
.hdr-m{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:600;fill:#2d5896}
.hdr-i{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:600;fill:#0d7069}
.hdr-b{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:600;fill:#9a5a08}
.hdr{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:600;fill:#16202a}
.box-m{fill:#e4ecf7;stroke:#2d5896;stroke-width:1.5}
.box-i{fill:#e2f1ef;stroke:#0d7069;stroke-width:1.5}
.box-b{fill:#f6ebdc;stroke:#9a5a08;stroke-width:1.5}
.box-n{fill:#f3f6f7;stroke:#56636f;stroke-width:1.2}
.card-m{fill:#ffffff;stroke:#2d5896;stroke-width:1}
.card-i{fill:#ffffff;stroke:#0d7069;stroke-width:1}
.card-b{fill:#ffffff;stroke:#9a5a08;stroke-width:1}
.q{fill:#ffffff;stroke:#16202a;stroke-width:1.2}
.ext{fill:#f3f6f7;stroke:#56636f;stroke-width:1.2;stroke-dasharray:4 3}
.edge{fill:none;stroke:#16202a;stroke-width:1.4}
.edge-d{fill:none;stroke:#16202a;stroke-width:1.4;stroke-dasharray:5 4}
.edge-b{fill:none;stroke:#9a5a08;stroke-width:1.5}
.ah{fill:#16202a}
.ah-b{fill:#9a5a08}
.rule{stroke:#c7d1d9;stroke-width:1}
.hl-m{fill:#2d5896}
.hl-i{fill:#0d7069}
.hl-b{fill:#9a5a08}
text{font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif}</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
        <marker id="m3" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="ah"/></marker>
        <marker id="m3b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="ah-b"/></marker>
      </defs>
      <text x="20" y="44" class="sm">points in with href "#uuid"</text>
      <rect x="20" y="60" width="260" height="56" rx="4" class="card-i"/>
      <text x="34" y="82" class="fx">import-profile.href</text>
      <text x="34" y="102" class="f">the baseline this SSP applies</text>
      <rect x="20" y="136" width="260" height="56" rx="4" class="card-i"/>
      <text x="34" y="158" class="fx">by-components[].links[].href</text>
      <text x="34" y="178" class="f">evidence for one control response</text>
      <rect x="20" y="212" width="260" height="56" rx="4" class="card-i"/>
      <text x="34" y="234" class="fx">relevant-evidence[].href</text>
      <text x="34" y="254" class="f">evidence for one SAR observation</text>
      <rect x="20" y="288" width="260" height="56" rx="4" class="card-m"/>
      <text x="34" y="310" class="fx">diagrams[].links · parties[].links</text>
      <text x="34" y="330" class="f">boundary diagrams, logos, contracts</text>

      <path d="M280,88 C312,88 312,150 336,150" class="edge" marker-end="url(#m3)"/>
      <path d="M280,164 C312,164 312,170 336,170" class="edge" marker-end="url(#m3)"/>
      <path d="M280,240 C312,240 312,190 336,190" class="edge" marker-end="url(#m3)"/>
      <path d="M280,316 C312,316 312,210 336,210" class="edge" marker-end="url(#m3)"/>

      <rect x="340" y="40" width="300" height="400" rx="6" class="box-b"/>
      <text x="356" y="66" class="hdr-b">back-matter.resources[]</text>
      <line x1="340" y1="80" x2="640" y2="80" class="rule"/>
      <text x="356" y="104" class="fx">uuid* <tspan class="f">b7f04d29-…-d20e7a61c5f8</tspan></text>
      <text x="356" y="128" class="fx">title <tspan class="f">"Account Management Procedure v4"</tspan></text>
      <text x="356" y="152" class="fx">document-ids <tspan class="f">[{ scheme, identifier }]</tspan></text>
      <text x="356" y="176" class="fx">citation <tspan class="f">{ text* }</tspan></text>
      <text x="356" y="200" class="fx">props <tspan class="f">[{ name, value, ns }]</tspan></text>
      <rect x="356" y="218" width="268" height="118" rx="4" class="card-b"/>
      <text x="370" y="240" class="fx" style="font-weight:600">rlinks[]</text>
      <text x="370" y="262" class="fx">href* <tspan class="f">https://evidence…/proc-v4.pdf</tspan></text>
      <text x="370" y="284" class="fx">media-type <tspan class="f">application/pdf</tspan></text>
      <text x="370" y="306" class="fx">hashes <tspan class="f">[{ algorithm: SHA-256,</tspan></text>
      <text x="370" y="324" class="f">          value: 3f9a… }]</text>
      <rect x="356" y="350" width="268" height="72" rx="4" class="card-b" style="stroke-dasharray:4 3"/>
      <text x="370" y="372" class="fx" style="font-weight:600">base64 <tspan class="f" style="font-weight:400">optional embedded copy</tspan></text>
      <text x="370" y="394" class="f">filename · media-type · value*</text>
      <text x="370" y="412" class="f">travels with the document</text>

      <path d="M624,262 C660,262 660,120 700,120" class="edge-b" marker-end="url(#m3b)"/>
      <rect x="704" y="92" width="236" height="56" rx="4" class="ext"/>
      <text x="718" y="114" class="t">Document repository</text>
      <text x="718" y="134" class="f">proc-v4.pdf · application/pdf</text>
      <rect x="704" y="182" width="236" height="56" rx="4" class="ext"/>
      <text x="718" y="204" class="t">Evidence store</text>
      <text x="718" y="224" class="f">c93d… → results.hdf.json</text>
      <path d="M624,312 C680,312 680,318 700,318" class="edge-b" marker-end="url(#m3b)"/>
      <rect x="704" y="282" width="236" height="72" rx="4" class="q"/>
      <text x="718" y="304" class="t">Verify before trusting</text>
      <text x="718" y="324" class="f">fetch href → SHA-256 →</text>
      <text x="718" y="342" class="f">compare with hashes[].value</text>
      <text x="20" y="462" class="sm">* required. OSCAL hash algorithms: SHA-224/256/384/512, SHA3-224/256/384/512.</text>
      <text x="20" y="478" class="sm">Each resource has its own rlinks; the evidence store is the target of a second resource with the same shape.</text>
    </svg>