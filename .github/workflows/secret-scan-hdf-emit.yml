name: Secret scan HDF emit (TruffleHog)

# Caller for the reusable secret-scan-hdf.yml published by the DevSecOps baseline.
#
# Companion to secret-scan.yml, which is the GATE. The gate answers "are there
# secrets" and stops; this converts the result to HDF so it joins the same
# evidence stream as the SonarQube emit already in this repository.
#
# ---- Why a caller here, when the SonarQube job is owned in-repo ---------------
#
# The SonarQube job deliberately stopped calling another repository, and that
# reasoning does NOT extend to this file. It applied to a reusable owned by
# container-build-sign, which is INTERNAL — GitHub does not let a public
# repository call a workflow from a private or internal one, so every public
# consumer failed at validation with a 0-second, 0-job run and no logs to read.
#
# dev-sec-ops-baseline is PUBLIC, so that constraint does not apply, and the
# pattern is demonstrably working: cis-docker-baseline, cis-nginx-baseline and
# stig-aws-ecr-baseline are all public callers of this same pinned reusable and
# all three ran green today, landing real objects under their trufflehog prefixes.
#
# So this stays a caller rather than a ~180-line copy. Do not inline it on the
# strength of that change without re-checking the visibility distinction first.
#
# ---- What the reusable fixes -------------------------------------------------
#
# The pattern it replaced skipped the upload entirely when TruffleHog found
# nothing. A clean scan is the normal case, so an empty prefix — byte-for-byte
# what a broken pipeline leaves — was the steady state, and coverage profiles
# read it as unevidenced. Correctly.
#
# The reusable emits a one-control HDF recording the execution on a clean run, so
# "we scanned it and it was clean" is something the evidence can finally say.
#
# Never runs on pull_request: a fork PR would run this with write-ish intent, and
# the evidence stream should only reflect what landed on the default branch.

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 12 * * 1'   # weekly, offset from the gate's daily run
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # Fail fast rather than handing an empty boundary to the reusable, which would
  # label the evidence with nothing and file it at the wrong key.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required configuration
        env:
          BOUNDARY: ${{ vars.EVIDENCE_BOUNDARY }}
        run: |
          set -euo pipefail
          if [ -z "${BOUNDARY:-}" ]; then
            echo "::error::EVIDENCE_BOUNDARY is not set. Set it as a repository or organization variable; it labels the evidence and has no safe default."
            exit 1
          fi

  emit:
    needs: preflight
    uses: risk-sentinel/dev-sec-ops-baseline/.github/workflows/secret-scan-hdf.yml@949e54cbbf42fafe79903c4329c11e9146dae87d  # v0.4.0
    with:
      boundary: ${{ vars.EVIDENCE_BOUNDARY }}
    secrets:
      S3_EMIT_ROLE_ARN: ${{ secrets.NIST_800_53_PROFILE_EMIT_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      COMPLIANCE_S3_BUCKET: ${{ secrets.COMPLIANCE_S3_BUCKET }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
