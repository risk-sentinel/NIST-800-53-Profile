name: nist-800-53-rev5
title: NIST SP 800-53 Revision 5 control skeleton
maintainer: Risk Sentinel
copyright: Risk Sentinel
copyright_email: support@risk-sentinel.org
license: Apache-2.0
version: 0.1.0
inspec_version: '>= 5.0'
summary: |
  Every NIST SP 800-53 Rev 5 control, carrying its control language and
  its SP 800-53A assessment procedure. No control is automated: each test
  skips, so a run reports the catalog as Not Reviewed rather than passing.

  Organization-defined parameters are declared as inputs and interpolate
  into the control prose; supply them with --input-file inputs.yml.

  Generated from the NIST OSCAL catalog (5.2.0)
  by tools/nist_catalog_to_inspec/generate.py -- do not hand-edit.

# Platform-agnostic: the catalog is not tied to a cloud or an OS, and no
# control executes a check. Automated descendants declare their own.
supports: []

# Organization-defined parameters (ODPs). Defaults are bracketed
# placeholders so the profile runs unconfigured; supply real values with
#   --input-file inputs.yml
